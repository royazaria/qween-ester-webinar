<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נרשמת · לפני הכנס עם אסתר מלכה</title>
<meta name="theme-color" content="#22060f">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2322060f'/%3E%3Cpath d='M14 42 L18 22 L26 32 L32 18 L38 32 L46 22 L50 42 Z' fill='%23F0C46A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://player.vimeo.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@700;900&family=Gveret+Levin&display=swap">
<style>
:root{
  --bg:#22060f; --card:#350b1a; --line:rgba(240,196,106,.22);
  --ink:#f3e7da; --soft:#c9b3a2; --gold:#f0c46a; --gold2:#ffd98a; --white:#fbe9d4;
  --serif:"Frank Ruhl Libre",Georgia,serif; --sans:"Assistant",Arial,sans-serif; --hand:"Gveret Levin","Frank Ruhl Libre",serif;
  --goldtext:linear-gradient(180deg,#fff1c9 0%,#ffd98a 38%,#e9b04a 72%,#c8902f 100%);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;min-height:100svh;color:var(--ink);font-family:var(--sans);font-size:19px;line-height:1.7;text-align:center;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 60% at 50% 0%,#5e1226 0%,rgba(34,6,15,0) 62%),radial-gradient(70% 45% at 0% 100%,rgba(130,24,48,.5),transparent 70%),var(--bg)}
h1{font-family:var(--serif);font-weight:900;color:var(--white);font-size:clamp(28px,6.4vw,44px);line-height:1.22;margin:0 0 10px;text-wrap:balance}
h1 em{font-style:normal;background:var(--goldtext);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0 0 14px}
.wrap{max-width:860px;margin:0 auto;padding:36px 20px 60px}
.lead{font-size:clamp(17px,4.2vw,20px);color:#eadbc9;max-width:560px;margin:0 auto}
.lead b{color:var(--gold2)}

/* the video */
.video{position:relative;margin:26px auto 0;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#14030a;border:1px solid rgba(255,217,138,.45);box-shadow:0 30px 70px -26px rgba(0,0,0,.85),0 0 46px rgba(240,196,106,.18)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--soft);font-size:16px;padding:20px}

/* step 2 */
.next{margin:34px auto 0;max-width:520px}
.next h2{font-family:var(--serif);font-weight:700;color:var(--white);font-size:clamp(22px,5vw,28px);line-height:1.3;margin:0 0 14px;text-wrap:balance}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font-weight:700;font-size:20px;color:#2a0d02;
  background:linear-gradient(180deg,#fff0c4 0%,#ffe7a8 18%,#f6cf72 50%,#c98a26 100%);border:1px solid #ffe6a6;border-radius:999px;padding:16px 40px;min-height:60px;
  box-shadow:0 0 0 6px rgba(240,196,106,.12),0 14px 34px -10px rgba(240,180,80,.6);transition:transform .15s ease,box-shadow .15s ease}
.cta:hover{transform:translateY(-2px)}
.cta:focus-visible{outline:3px solid var(--gold2);outline-offset:4px}
.cta svg{width:22px;height:22px;flex:none}
.cta[aria-disabled=true]{opacity:.55;pointer-events:none}
.note{font-size:15px;color:var(--soft);margin:12px 0 0}
.sign{font-family:var(--hand);color:var(--gold2);font-size:30px;margin-top:34px}
footer{padding:0 20px 30px;font-size:14px;color:var(--soft)}
footer a{color:var(--soft)}
</style>
</head>
<body>
<main class="wrap">
  <h1>נרשמת, מלכה. <em>עכשיו הצעד הראשון</em></h1>
  <p class="lead">לפני הכנס <b>ביום ראשון, 1.11</b>, צפי בסרטון הקצר הזה. הוא יכין אותך למה שנעשה יחד.</p>

  <div class="video" id="video"><div class="empty">הסרטון יעלה כאן</div></div>

  <div class="next">
    <h2>ועכשיו, הצטרפי לקבוצת הוואטסאפ של הכנס</h2>
    <a class="cta" id="wa" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3a.5.5 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.6 2.6 0 0 0 1.7-1.2 2.1 2.1 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3Z"/></svg>
      אני מצטרפת לקבוצה
    </a>
    <p class="note">שם תקבלי את הקישור לזום ותזכורת לפני שמתחילים.</p>
  </div>

  <div class="sign">מחכה לך, אסתר מלכה</div>
</main>
<footer>
  <span>© אסתר מלכה</span> · <!-- TODO רועי: דף הצהרת נגישות --><a href="#" data-todo="accessibility-statement">הצהרת נגישות</a>
</footer>

<script>
/* ---- להגדיר לפני שעולים לאוויר ---- */
var CONFIG = {
  vimeo: '',     // הקישור לסרטון ב-Vimeo, למשל https://vimeo.com/123456789 או https://vimeo.com/123456789/abcdef1234 (סרטון לא-רשום)
  whatsapp: ''   // הקישור לקבוצת הוואטסאפ של הכנס, https://chat.whatsapp.com/...
};

(function(){
  // vimeo.com/ID or vimeo.com/ID/HASH (unlisted) → player URL
  var m = CONFIG.vimeo.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([0-9a-f]+))?/i);
  if (m) {
    var src = 'https://player.vimeo.com/video/' + m[1] + '?' + (m[2] ? 'h=' + m[2] + '&' : '') + 'title=0&byline=0&portrait=0&dnt=1';
    var f = document.createElement('iframe');
    f.src = src; f.title = 'הסרטון של אסתר לפני הכנס';
    f.allow = 'autoplay; fullscreen; picture-in-picture'; f.allowFullscreen = true;
    var box = document.getElementById('video'); box.innerHTML = ''; box.appendChild(f);
  }
  var wa = document.getElementById('wa');
  if (CONFIG.whatsapp) wa.href = CONFIG.whatsapp; else wa.setAttribute('aria-disabled', 'true');
})();
</script>
</body>
</html>
